[build]
publish = "theme"
command = "npm install --prefix .cache/netlify-tools --no-save --package-lock=false --no-audit --no-fund ffmpeg-static@5.3.0 && FFMPEG_PATH=./.cache/netlify-tools/node_modules/ffmpeg-static/ffmpeg npm run build"

[build.environment]
NODE_VERSION = "20"

[[redirects]]
from = "/contact"
to = "/contact/index.html"
status = 200

[[redirects]]
from = "/about"
to = "/about/index.html"
status = 200

[[headers]]
for = "/*" # This defines which paths this specific [[headers]] block will cover.

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "same-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
